[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # (Node 22: the long-term support version; 20 reached its end of life in April 2026)
  NODE_VERSION = "22"
  # Netlify's smart secret detection fails the build when it sees a value shaped like
  # a Google API key. The Firebase web apiKey (src/firebase-config.js) is public by
  # design (access is controlled by Firebase Auth and firestore.rules), so allow just
  # that one value; secret scanning stays on for everything else.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCNI8dJaXA70z5y0oX5tu6DqzBPN9dvsGo"

# Firebase sign-in through the site's own address (src/firebase-config.js OWN_AUTH_DOMAINS):
# its helper pages (/__/auth/…, /__/firebase/init.json) come from Firebase.
[[redirects]]
  from = "/__/*"
  to = "https://candoni-fts-a2f16.firebaseapp.com/__/:splat"
  status = 200
  force = true

# Single-page app: let React Router handle every path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN: the sign-in helper (/__/auth/iframe) is framed by the site itself.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # always over HTTPS; DMS uses no camera, microphone or location
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[functions]
  node_bundler = "esbuild"
